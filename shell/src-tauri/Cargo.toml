[package]
name = "shell"
version = "0.1.0"
description = "xGetSongs: downloads the audio of YouTube videos as m4a files"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xgs-sidecar = { path = "../../sidecar-host" }

[target.'cfg(windows)'.dependencies]
# The hidden browser window of the Google lyrics lookup runs scripts through WebView2's own interface (`browser_window.rs`). Both are
# the versions Tauri's own web view layer (wry) uses, so nothing new is compiled for them.
webview2-com = "0.39.1"
windows-core = "0.62"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
